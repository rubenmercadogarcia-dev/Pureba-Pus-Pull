<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi querido cuadrado de colores</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f4f6; font-family: system-ui, sans-serif; color: #202938; }
    main { width: min(90vw, 430px); padding: 36px; border-radius: 20px; background: white; box-shadow: 0 12px 40px #00000012; text-align: center; }
    h1 { font-size: 1.6rem; margin: 0 0 8px; }
    p { color: #596273; margin: 0 0 26px; }
    #cuadrado { width: 180px; height: 180px; margin: 0 auto 28px; border-radius: 10px; background: #6366f1; transition: background-color .2s ease; }
    label { display: block; margin-bottom: 10px; font-weight: 600; }
    select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #cbd5e1; background: white; font: inherit; }
  </style>
</head>
<body>
  <main>
    <h1>Mi querido cuadrado de colores</h1>
    <p>Selecciona un color para cambiar el cuadrado.</p>
    <div id="cuadrado" aria-label="Cuadrado de color"></div>
    <label for="color">Color del cuadrado</label>
    <select id="color">
      <option value="#6366f1">Morado</option>
      <option value="#ef4444">Rojo</option>
      <option value="#22c55e">Verde</option>
      <option value="#3b82f6">Azul</option>
      <option value="#f59e0b">Amarillo</option>
      <option value="#111827">Negro</option>
    </select>
  </main>
  <script>
    const selector = document.getElementById('color');
    const cuadrado = document.getElementById('cuadrado');
    selector.addEventListener('change', () => { cuadrado.style.backgroundColor = selector.value; });
  </script>
</body>
</html>
